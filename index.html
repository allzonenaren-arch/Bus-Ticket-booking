<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🚌 Bus Ticket Booking</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Bookings</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>Book Your Bus Ticket Online</h2>
    <p>Fast, Easy and Secure Booking</p>
</section>

<section class="booking-form">
    <h2>Search Buses</h2>

    <form id="busForm">
        <input type="text" id="from" placeholder="From" required>

        <input type="text" id="to" placeholder="To" required>

        <input type="date" id="date" required>

        <button type="submit">Search Bus</button>
    </form>
</section>

<section id="result">
</section>

<footer>
    <p>© 2026 Bus Ticket Booking System</p>
</footer>

<script src="script.js"></script>
</body>
</html>
